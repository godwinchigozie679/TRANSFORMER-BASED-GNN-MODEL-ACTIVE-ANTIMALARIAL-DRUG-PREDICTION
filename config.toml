
[data]
path = "main_data_2/Drug_activity.csv"
cache_path = "enhanced_drug_data_with_descriptors.csv"
use_cache = true  # skips recomputing descriptors if this file already exists
graph_cache_path = "molecule_graphs.pt"  # cached graphs, keyed by SMILES


# at the real distribution.
balance_full_dataset = true
balanced_path = "main_data_2/Drug_activity_balanced.csv"
balanced_cache_path = "balanced_descriptors.csv"
balanced_graph_cache_path = "balanced_molecule_graphs.pt"

[run]
seed = 42
device = "cpu"  # cuda if you have it, mps is flaky here so just skip it

[crossval]
folds = 5
correlation_threshold = 0.85
models = []          # empty = run all four, or list e.g. ["gcn", "gat"]
skip_baseline = false
baseline_models = [] # empty = run all five

[training]
epochs = 200
initial_lr = 0.001
weight_decay = 1e-4
early_stop_patience = 25
batch_size = 64   # bumped up from 32, noticeably faster and still fits fine
hidden_dim = 128
dropout = 0.2

[explain]
n_molecules = 20

[tuning]
test_size = 0.2  # held-out 20% test set
folds = 3        # cut down from 5 for speed, a bit noisier but fine
epochs = 25      # cap during tuning, don't need full convergence here
patience = 6

[eda]
enabled_by_default = true

[visualize]
n_molecules = 3

[paths]
output_dir = "test_results"
model_dir = "trained_models"
history_dir = "training_history"
figure_dir = "figures"
